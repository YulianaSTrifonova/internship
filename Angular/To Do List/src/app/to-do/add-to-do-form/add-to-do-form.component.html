<form class="row mt-3 gx-3 gy-2 align-items-center justify-content-center">
  <div class="col-sm-6">
    <label for="specificSizeInputName" class="visually-hidden">To Do</label>
    <input
      type="text"
      name="new-to-do"
      class="form-control"
      [(ngModel)]="newToDoText"
    />
  </div>
  <div class="col-auto">
    <button
      type="submit"
      class="btn btn-primary"
      (click)="$event.preventDefault(); addNewToDo()"
    >
      Add To Do
    </button>
  </div>
</form>
