<div style="padding: 2rem 7rem; margin-left: 2rem">
    <h2>{{ "translations.directives" | translate }}</h2>
    <p appTooltip="{{ 'translations.tooltip-content' | translate }}" i18n-appTooltip>
        {{ "translations.tooltip-text" | translate }}

    </p>

    <div appColorChange [eventType]="'click'" [color]="'green'" [cssAttribute]="'color'">
        {{ "translations.color-changing-text" | translate }}
    </div>
</div>
