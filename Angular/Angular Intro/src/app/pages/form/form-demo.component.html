<div class="form-container">
    <h3>Template-Driven Form</h3>
    <form #form="ngForm" (ngSubmit)="onSubmit()">
        <ng-template #inputField let-field="field" let-fieldName="fieldName" let-index="index">
            <div
                class="form-group"
                [ngClass]="{ 'input-with-error': field?.invalid && (field?.dirty || field?.touched) }"
            >
                <mat-form-field class="full-width" appearance="outline">
                    <mat-label>Field {{ index + 1 }}</mat-label>
                    <input
                        matInput
                        type="text"
                        [name]="fieldName"
                        [(ngModel)]="templateForm[fieldName]"
                        required
                        minlength="3"
                        #field="ngModel"
                    />
                    <mat-error *ngIf="field?.invalid && (field?.dirty || field?.touched)">
                        <div *ngIf="field?.errors?.['required']">Field {{ index + 1 }} is required.</div>
                        <div *ngIf="field?.errors?.['minlength']">
                            Field {{ index + 1 }} must be at least 3 characters long.
                        </div>
                    </mat-error>
                </mat-form-field>
            </div>
        </ng-template>

        <ng-container *ngFor="let fieldName of ['field1', 'field2', 'field3', 'field4']; let i = index">
            <ng-container
                *ngTemplateOutlet="
                    inputField;
                    context: { field: form.controls[fieldName], fieldName: fieldName, index: i }
                "
            ></ng-container>
        </ng-container>

        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Submit</button>
    </form>
</div>

<div class="form-container">
    <h3>Reactive Form</h3>
    <form [formGroup]="reactiveForm" (ngSubmit)="submitForm()">
        <ng-template #reactiveInputField let-fieldName="fieldName" let-index="index">
            <mat-form-field
                class="form-group"
                appearance="outline"
                [ngClass]="{
                    'input-with-error':
                        reactiveForm.get(fieldName)?.invalid &&
                        (reactiveForm.get(fieldName)?.dirty || reactiveForm.get(fieldName)?.touched)
                }"
            >
                <mat-label>Field {{ index + 1 }}</mat-label>
                <input matInput type="text" [formControlName]="fieldName" />
                <mat-error
                    *ngIf="
                        reactiveForm.get(fieldName)?.invalid &&
                        (reactiveForm.get(fieldName)?.dirty || reactiveForm.get(fieldName)?.touched)
                    "
                >
                    <div *ngIf="reactiveForm.get(fieldName)?.errors?.['required']">
                        Field {{ index + 1 }} is required.
                    </div>
                    <div *ngIf="reactiveForm.get(fieldName)?.errors?.['pattern']">
                        Field {{ index + 1 }} must be a number.
                    </div>
                </mat-error>
            </mat-form-field>
        </ng-template>

        <ng-container
            *ngFor="let field of ['field1Control', 'field2Control', 'field3Control', 'field4Control']; let i = index"
        >
            <ng-container
                *ngTemplateOutlet="reactiveInputField; context: { fieldName: field, index: i }"
            ></ng-container>
        </ng-container>

        <div *ngIf="reactiveForm.errors?.['sumNot100']" class="error-message">
            The sum of all fields must equal 100.
        </div>
        <button mat-raised-button color="primary" type="submit" [disabled]="reactiveForm.invalid">Submit</button>
    </form>
</div>
