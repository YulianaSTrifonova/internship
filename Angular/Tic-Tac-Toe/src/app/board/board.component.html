<div class="game-container">
  <div class="board-border">
    <div class="board">
      <app-square
        *ngFor="let square of squares; let i = index"
        [value]="square"
        (click)="makeMove(i)"
      >
      </app-square>
    </div>
  </div>
  <button class="new-game" (click)="newGame()">New Game</button>
  <div class="result" *ngIf="winner">Winner: {{ winner }}</div>
</div>
